<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14161c">
<title>高値ブレイク板</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="app-header">
  <div class="app-header-row">
    <h1 class="app-title">高値ブレイク板</h1>
    <button class="info-btn" id="infoBtn" aria-label="このアプリについて">?</button>
  </div>
  <p class="updated-at" id="updatedAt">更新情報を読み込み中…</p>
</header>

<nav class="tabbar" role="tablist" aria-label="表示切替">
  <button class="tab-btn is-active" id="tabToday" role="tab" aria-selected="true">本日の候補</button>
  <button class="tab-btn" id="tabHistory" role="tab" aria-selected="false">履歴</button>
</nav>

<div class="history-picker" id="historyPicker" hidden>
  <label for="dateSelect" class="history-picker-label">日付を選択</label>
  <select id="dateSelect"></select>
</div>

<main id="listRoot" class="list-root">
  <p class="state-msg">読み込み中…</p>
</main>

<div class="sheet-backdrop" id="infoSheetBackdrop" hidden>
  <div class="sheet" role="dialog" aria-label="このアプリについて">
    <h2 class="sheet-title">このアプリについて</h2>
    <p>
      本アプリは、東証プライム市場の過去データを統計的に分析し、
      「52週高値圏で、かつ過去の実績が良好だったパターン」に合致する銘柄を
      毎日自動で抽出・表示するものです。
    </p>
    <p>
      <strong>投資助言ではありません。</strong>
      表示される情報はすべて過去の統計にもとづく参考情報であり、
      将来の値動きを保証するものではありません。売買の最終判断は、
      ご自身の責任で行ってください。
    </p>
    <p class="sheet-note">
      スコアの内訳・売買時のチェック手順は、リポジトリ内の
      <code>TRADING_RULE.md</code> / <code>HOW_TO_TRADE.md</code> を
      参照してください。
    </p>
    <button class="sheet-close" id="infoSheetClose">閉じる</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
