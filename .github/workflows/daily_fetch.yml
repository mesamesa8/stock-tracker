name: Daily Market Data Fetch

on:
  schedule:
    # 毎日 07:00 UTC = 日本時間 16:00 (大引け後、余裕を持たせて実行)
    # 土日も一応起動するが、その日はデータが0件で正常終了するだけなので害はない
    - cron: "0 7 * * *"
  workflow_dispatch: {}  # 手動実行ボタンも使えるようにしておく

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # DBファイルをリポジトリにコミットするために必要
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily fetch script
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
        run: python main.py

      - name: Commit updated database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add market_data.sqlite3
          git diff --quiet --cached || git commit -m "Update market data ($(date -u +'%Y-%m-%d'))"
          git push
